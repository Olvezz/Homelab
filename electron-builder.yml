appId: local.olvezz.homelab-desktop
productName: HomeLab Desktop
directories:
  buildResources: resources
copyright: Copyright © 2026. Todos los derechos reservados.
files:
  - out/**/*
  - package.json
  - resources/**/*
# Los documentos legales viajan junto a la aplicación (carpeta resources/legal)
extraResources:
  - from: legal
    to: legal
  - LICENSE
  - THIRD_PARTY_NOTICES.md
win:
  target: nsis
  artifactName: HomeLab-Desktop-Setup-${version}.${ext}
  icon: resources/icon.png
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  # Los datos (config, paneles, sesiones) viven en %APPDATA%\homelab-desktop: nunca se borran al desinstalar ni actualizar
  deleteAppDataOnUninstall: false
# Auto-update: descarga las versiones publicadas (GitHub Releases) por HTTPS y valida su sha512.
# Publicar una versión: ver README ("Publicar una actualización").
publish:
  - provider: github
    owner: Olvezz
    repo: Homelab
